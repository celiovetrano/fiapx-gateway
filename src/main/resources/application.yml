server:
  port: 8080

spring:
  application:
    name: fiapx-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/.well-known/**
        - id: video-api
          uri: ${VIDEO_API_URL:http://localhost:8082}
          predicates:
            # "/**" também casa com /api/v1/videos (zero segmentos)
            - Path=/api/v1/videos/**

fiapx:
  gateway:
    login-rate-limit:
      max-attempts: 10
      window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
